#!/usr/sbin/nft -f
# <TAG> fail-closed (Linux): 仅管理独立 table inet cchouse_guard，绝不执行 flush ruleset。
# 严格正向白名单：仅放行 cchouse0 TUN 设备、mihomo 用户(<MIHOMO_USER>)到钉死出口 IP:端口、局域网/VMnet SSH 入站、DHCP；IPv6 全封。

table inet cchouse_guard {}
delete table inet cchouse_guard

table inet cchouse_guard {
  set ssh_nets {
    type ipv4_addr
    flags interval
    elements = { <VMNET_CIDR>, <HOME_LAN_CIDR>, 192.168.64.0/24 }
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    # mihomo TUN stack=system 会将客机出站包改写后经 cchouse0 注回内核 TCP 监听端口，必须对称放行
    iifname "cchouse0" meta nfproto ipv4 accept
    meta nfproto ipv6 drop
    ct state established,related accept
    ip saddr @ssh_nets tcp dport 22 accept
    udp sport 67 udp dport 68 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oifname "lo" accept
    meta nfproto ipv6 drop
    # 正向白名单：仅放行进入固定 TUN 设备 cchouse0 的 IPv4 流量（绝不用 != 物理网卡名）
    oifname "cchouse0" meta nfproto ipv4 accept
    ct state established,related accept
    # 仅放行 mihomo 专用用户到钉死入口 IP:端口（不绑定物理网卡名，防 ens33/ens160 差异导致断网）
<NFT_EGRESS_RULES>
    # DHCP
    udp sport 68 udp dport 67 accept
  }
}
