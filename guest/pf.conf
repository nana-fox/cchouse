# <TAG> fail-closed: physical en0 only to fronts (self-hosted front:<FRONT_PORT>, CF front & airport:443), SSH in from LAN, DHCP
fronts = "{ <FRONT_CF_SERVER_IP>, <NODE_WS_SERVER_IP>, <NODE_REALITY_SERVER_IP> }"
lan = "{ <HOME_LAN_CIDR>, 192.168.64.0/24 }"
set skip on lo0
set block-policy drop
block drop all
block drop quick inet6 all
pass quick on ! en0 inet all
pass out quick on en0 inet proto tcp to <FRONT_SERVER_IP> port <FRONT_PORT> keep state
pass out quick on en0 inet proto tcp to $fronts port 443 keep state
pass in quick on en0 inet proto tcp from $lan to port 22 keep state
pass out quick on en0 inet proto udp from port 68 to port 67 keep state
pass in quick on en0 inet proto udp from port 67 to port 68 keep state
